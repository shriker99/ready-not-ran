<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ready ≠ Ran — in action</title>
<style>
:root { --bg:#14110e; --ink:#f4efe6; --mute:#b7aa98; --gold:#e2b15a; --card:#221d18; --line:#3a322a; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
.wrap { max-width:920px; margin:0 auto; padding:28px 16px 64px; }
h1 { font-size:28px; letter-spacing:-0.03em; }
.lede { color:var(--mute); margin:8px 0 24px; }
.clip { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:18px; }
.n { color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
img, object, svg { width:100%; height:auto; display:block; border-radius:10px; }
a { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ready ≠ Ran in action</h1>
  <p class="lede">Four stills of the product. These are mock frames, not a recording from someone’s PC. Open the <a href="sample-report.html">sample report</a> for the HTML dashboard.</p>
  <div class="clip"><div class="n">1 · Scan</div><img src="clips/01-scan.svg" alt="Scan this PC"></div>
  <div class="clip"><div class="n">2 · Problems first</div><img src="clips/02-list.svg" alt="Problem list"></div>
  <div class="clip"><div class="n">3 · Tick settings and confirm</div><img src="clips/03-apply.svg" alt="Apply settings"></div>
  <div class="clip"><div class="n">4 · Undo from backup</div><img src="clips/04-undo.svg" alt="Undo last apply"></div>
</div>
</body>
</html>
